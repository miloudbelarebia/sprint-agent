[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sprint-agent-cli"
version = "0.4.0"
description = "Turn any AI agent into an agile developer. Persistent sprint context for Claude Code, Cursor, Copilot, and more."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Miloud Belarebia", email = "databelarebia@gmail.com"},
]
keywords = ["ai", "agent", "agile", "sprint", "claude", "cursor", "copilot", "developer-tools", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/miloudbelarebia/sprint-agent"
Repository = "https://github.com/miloudbelarebia/sprint-agent"
Issues = "https://github.com/miloudbelarebia/sprint-agent/issues"
Changelog = "https://github.com/miloudbelarebia/sprint-agent/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["sprint_agent"]

[project.scripts]
sprint-agent = "sprint_agent:main"
