name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m py_compile sprint_agent.py

      - name: Help works
        run: python sprint_agent.py --help

      - name: Version works
        run: python sprint_agent.py --version

      - name: Smoke test — init + status + backlog + sprint + retro
        shell: bash
        run: |
          mkdir test-proj && cd test-proj
          python ../sprint_agent.py init --name "smoke-test" --agent claude
          test -d .sprint
          test -f .sprint/AGENT.md
          test -f .sprint/backlog.md
          test -f .sprint/config.yaml
          test -f CLAUDE.md
          python ../sprint_agent.py status
          python ../sprint_agent.py backlog add "Test ticket" --priority P1 --effort S
          python ../sprint_agent.py backlog list
          python ../sprint_agent.py sprint new --goal "Test goal"
          python ../sprint_agent.py retro
          python ../sprint_agent.py config

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check sprint_agent.py --select E,F,W --ignore E501
