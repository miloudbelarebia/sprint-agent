name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.10", "3.12"]
        exclude:
          - os: macos-latest
            python-version: "3.8"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Syntax check
        run: python -m py_compile sprint_agent.py

      - name: CLI smoke
        run: |
          sprint-agent --help
          sprint-agent --version

      - name: pytest suite
        run: pytest tests/ -v

      - name: End-to-end smoke (init/status/backlog/sprint/retro)
        shell: bash
        run: |
          mkdir test-proj && cd test-proj
          sprint-agent init --name "smoke-test" --agent claude
          test -d .sprint
          test -f .sprint/AGENT.md
          test -f .sprint/backlog.md
          test -f .sprint/config.yaml
          test -f CLAUDE.md
          sprint-agent status
          sprint-agent backlog add "Test ticket" --priority P1 --effort S
          sprint-agent backlog list
          sprint-agent sprint new --goal "Test goal"
          sprint-agent retro
          sprint-agent config

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build distribution
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
