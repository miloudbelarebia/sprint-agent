name: Feature request
description: Suggest a new feature for Sprint Agent
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Tell us about the workflow pain point first, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like Sprint Agent to handle it?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or approaches you tried.

  - type: dropdown
    id: agent
    attributes:
      label: Which AI agent are you using?
      multiple: true
      options:
        - Claude Code
        - Cursor
        - GitHub Copilot
        - OpenAI Codex
        - Gemini
        - Aider
        - Windsurf
        - Other
