<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system,BlinkMacSystemFont,system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#0f1a14"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d97e"/>
      <stop offset="100%" stop-color="#7be0a9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1a2028" stroke-width="1" opacity="0.6">
    <line x1="0" y1="158" x2="1200" y2="158"/>
    <line x1="0" y1="316" x2="1200" y2="316"/>
    <line x1="0" y1="474" x2="1200" y2="474"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- logo -->
  <rect x="80" y="78" width="64" height="64" rx="14" fill="#00d97e"/>
  <text x="112" y="124" text-anchor="middle" font-size="42" font-weight="900" fill="#0b0d10">S</text>

  <text x="164" y="124" font-size="34" font-weight="700" fill="#e6edf3">sprint-agent</text>

  <!-- pill -->
  <rect x="80" y="180" width="220" height="34" rx="17" fill="#11141a" stroke="#222831"/>
  <circle cx="100" cy="197" r="4" fill="#00d97e"/>
  <text x="115" y="202" font-size="13" fill="#9aa4b2">v0.4.0 — now on PyPI</text>

  <!-- headline -->
  <text x="80" y="290" font-size="62" font-weight="800" fill="#e6edf3" letter-spacing="-1.5">Persistent sprint context</text>
  <text x="80" y="362" font-size="62" font-weight="800" fill="#e6edf3" letter-spacing="-1.5">for <tspan fill="url(#accent)">AI coding agents</tspan>.</text>

  <!-- subhead -->
  <text x="80" y="420" font-size="22" fill="#9aa4b2">Claude Code · Cursor · Copilot · Codex · Gemini · Aider · Windsurf</text>

  <!-- stats -->
  <g transform="translate(80,470)">
    <rect width="240" height="100" rx="14" fill="#11141a" stroke="#222831"/>
    <text x="20" y="44" font-size="34" font-weight="700" fill="#00d97e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">−83%</text>
    <text x="20" y="76" font-size="14" fill="#9aa4b2">tokens per session</text>
  </g>
  <g transform="translate(340,470)">
    <rect width="240" height="100" rx="14" fill="#11141a" stroke="#222831"/>
    <text x="20" y="44" font-size="34" font-weight="700" fill="#00d97e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">4–7×</text>
    <text x="20" y="76" font-size="14" fill="#9aa4b2">faster session starts</text>
  </g>
  <g transform="translate(600,470)">
    <rect width="240" height="100" rx="14" fill="#11141a" stroke="#222831"/>
    <text x="20" y="44" font-size="34" font-weight="700" fill="#00d97e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">+50%</text>
    <text x="20" y="76" font-size="14" fill="#9aa4b2">real work / 30-min daily</text>
  </g>
  <g transform="translate(860,470)">
    <rect width="240" height="100" rx="14" fill="#11141a" stroke="#222831"/>
    <text x="20" y="44" font-size="34" font-weight="700" fill="#00d97e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">0</text>
    <text x="20" y="76" font-size="14" fill="#9aa4b2">runtime dependencies</text>
  </g>

  <!-- bottom right url -->
  <text x="1120" y="600" text-anchor="end" font-size="14" fill="#6b7280" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">github.com/miloudbelarebia/sprint-agent</text>
</svg>
